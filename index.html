<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Україна: Економічна стратегія 2016</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <header id="top">
    <div class="brand">🇺🇦 <span id="tCountry">—</span></div>
    <div class="stat"><small>Скарбниця</small><b id="tMoney">0 ₴</b><em id="tDelta"></em></div>
    <div class="stat"><small>Дата</small><b id="tDate">—</b></div>
    <div class="stat"><small>Населення</small><b id="tPop">0</b></div>
    <div class="stat"><small>ВВП (за рік)</small><b id="tGdp">0 ₴</b></div>
    <div class="stat"><small>Стан</small><b id="tWar">🕊️ Мир</b></div>
  </header>

  <div id="hint" style="display:none"></div>
  <div id="toasts"></div>
  <div id="info" class="hidden"></div>

  <aside id="panel" class="hidden">
    <div id="ptabs"></div>
    <div id="pbody"></div>
